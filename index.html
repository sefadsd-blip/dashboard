<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefas3DShop - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    @keyframes pulse-red {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 0.9); }
    }
    .pulse-low-spool { animation: pulse-red 2s infinite; }
  </style>
</head>
<body class="p-3 md:p-5 min-h-screen text-xs">

  <!-- OVERLAY / SUBPAGE: TOOLS & KATALOG -->
  <div id="subPageOverlay" class="hidden fixed inset-0 bg-slate-950/95 z-50 overflow-y-auto p-3 md:p-6">
    <div class="max-w-4xl mx-auto space-y-4">
      <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <div class="flex items-center space-x-3">
          <div class="bg-slate-900 p-2.5 rounded-xl border border-cyan-500/30 flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-toolbox text-cyan-400 text-lg"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">Sefas3DShop - Tools & Katalog</h2>
            <p class="text-slate-400 text-[11px]">Kostenrechner & Cloud-Verwaltung</p>
          </div>
        </div>
        <button onclick="closeSubPage()" class="bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/50 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-xmark text-sm"></i> Schließen & Zurück
        </button>
      </div>

      <!-- KOSTENRECHNER -->
      <section class="card p-4 rounded-xl space-y-2 border border-blue-500/30 bg-blue-950/10">
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <h2 class="text-xs font-semibold text-blue-400"><i class="fa-solid fa-calculator mr-1.5"></i> Kostenrechner (+ 35% & 1,50€)</h2>
        </div>
        <div class="space-y-2 pt-1">
          <div class="flex items-center gap-2">
            <input type="number" id="calcHours" oninput="calculateCosts()" placeholder="Zeit (h, z.B. 1.5)" min="0" step="0.1" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white w-full focus:outline-none focus:border-blue-500 transition">
            <input type="number" id="calcGrams" oninput="calculateCosts()" placeholder="Gewicht (g)" min="0" step="1" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white w-full focus:outline-none focus:border-blue-500 transition">
          </div>
          <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
            <div class="flex justify-between text-[11px] text-slate-400"><span>Druckzeit (0,25 €/h):</span> <span id="calcPrintCost">0,00 €</span></div>
            <div class="flex justify-between text-[11px] text-slate-400"><span>Strom (0,12 €/h):</span> <span id="calcElecCost">0,00 €</span></div>
            <div class="flex justify-between text-[11px] text-slate-400 border-b border-slate-700 pb-1.5 mb-1.5"><span>Material (0,02 €/g):</span> <span id="calcMatCost">0,00 €</span></div>
            <div class="flex justify-between text-[11px] text-slate-300"><span>Herstellung (Netto):</span> <span id="calcTotalCost">0,00 €</span></div>
            <div class="flex justify-between text-[11px] text-amber-400"><span>+ 35% Gewinn-Aufschlag:</span> <span id="calcMarkup">0,00 €</span></div>
            <div class="flex justify-between text-[11px] text-purple
