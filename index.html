<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefas3DShop - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    @media print {
      body * { visibility: hidden !important; }
      #printSection, #printSection *, #invoiceSection, #invoiceSection * { visibility: visible !important; }
      #printSection { position: fixed !important; left: 0; top: 0; width: 100vw; height: 100vh; background: #fff; color: #000; display: flex; justify-content: center; align-items: center; }
      #invoiceSection { position: absolute !important; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 10px; display: block; }
      .page-break-container { page-break-after: always; break-after: page; }
      @page { size: auto; margin: 5mm; }
    }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

  <div id="printSection" class="hidden"></div>
  <div id="invoiceSection" class="hidden"></div>

  <div class="max-w-[1700px] mx-auto space-y-6">
    
    <!-- HEADER -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 gap-4">
      <div class="flex items-center space-x-3">
        <div>
          <h1 class="text-xl font-bold text-white">Sefas<span class="text-cyan-400">3d</span>shop</h1>
          <p class="text-slate-400 text-xs">Dashboard v3 aktiv</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="exportAccountingCSV()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">📊 CSV Export</button>
        <button onclick="toggleArchiveView()" id="headerArchiveBtn" class="bg-purple-600/20 text-purple-300 border border-purple-500/50 px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">📂 Archiv anzeigen</button>
        <button onclick="loadCloudData()" class="bg-blue-600/20 text-blue-300 border border-blue-500/50 px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">🔄 Cloud abrufen</button>
        <button onclick="pushToCloudManual()" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/50 px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">📤 In Cloud speichern</button>
      </div>
    </header>

    <!-- STATISTIK -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card p-4 rounded-2xl">
        <p class="text-xs text-slate-400">Gesamt-Umsatz</p>
        <h3 id="statRevenue" class="text-2xl font-bold text-emerald-400">0,00 €</h3>
      </div>
      <div class="card p-4 rounded-2xl">
        <p class="text-xs text-slate-400">Gesamt-Ausgaben</p>
        <h3 id="statExpenses" class="text-2xl font-bold text-red-400">0,00 €</h3>
      </div>
      <div class="card p-4 rounded-2xl">
        <p class="text-xs text-slate-400">Reingewinn</p>
        <h3 id="statProfit" class="text-2xl font-bold text-blue-400">0,00 €</h3>
      </div>
      <div class="card p-4 rounded-2xl">
        <p class="text-xs text-slate-400">Offene Aufträge / Material</p>
        <h3 id="statOpenOrders" class="text-xl font-bold text-yellow-400">0 <span class="text-xs font-normal text-slate-400" id="statFilament">0g</span></h3>
      </div>
    </div>

    <!-- DRUCKER & FILAMENT -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="lg:col-span-2 space-y-3">
        <h2 class="text-md font-semibold text-slate-300">Drucker-Übersicht</h2>
        <div id="printersGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>
      <section class="card p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-md font-semibold text-slate-300">Filament-Lager</h2>
          <button onclick="addSpoolPrompt()" class="bg-slate-800 text-purple-300 text-xs px-2.5 py-1 rounded border border-purple-500/35 cursor-pointer">+ Spule</button>
        </div>
        <div id="spoolsList" class="space-y-2 max-h-[220px] overflow-y-auto"></div>
      </section>
    </div>

    <!-- NEUEN AUFTRAG ANLEGEN -->
    <section class="card p-5 rounded-2xl space-y-4">
      <h2 class="text-md font-semibold text-slate-300">Neuen Auftrag anlegen</h2>
      <form id="orderForm" onsubmit="addOrder(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <input type="text" id="customer" placeholder="Kundenname" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <select id="printer" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
            <option value="CR-10 Smart Pro #1">CR-10 Smart Pro #1</option>
            <option value="Ender 3 V3">Ender 3 V3</option>
            <option value="Anycubic Kobra">Anycubic Kobra</option>
            <option value="CR-10 Smart Pro #2">CR-10 Smart Pro #2</option>
          </select>
          <input type="number" step="0.01" id="price" placeholder="Artikelpreis (€)" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <select id="shipping" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
            <option value="7.00" selected>📦 Paketpauschale (7,00 €)</option>
            <option value="5.00">📦 Paketpauschale (5,00 €)</option>
            <option value="2.50">✉️ Warenpost (2,50 €)</option>
            <option value="0.00">🤝 Selbstabholung (0,00 €)</option>
          </select>
          <input type="date" id="orderDate" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="text" id="address" placeholder="Lieferadresse" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="text" id="tracking" placeholder="Tracking-Nummer" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="text" id="artName" placeholder="Artikelbezeichnung" value="3D-Druck Artikel" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl py-2.5 text-sm transition cursor-pointer">Auftrag Speichern</button>
      </form>
    </section>

    <!-- TABELLE -->
    <section class="card p-5 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 id="tableTitle" class="text-md font-semibold text-slate-300">Bestellungen (Aktiv)</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">Kunde</th>
              <th class="p-3">Rechnung-Nr.</th>
              <th class="p-3">Artikel</th>
              <th class="p-3">Drucker</th>
              <th class="p-3">Datum</th>
              <th class="p-3">Status</th>
              <th class="p-3">Preis</th>
              <th class="p-3 text-right">Aktionen</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const NPOINT_URL = 'https://api.npoint.io/6c03644a2096b02db81f';

    const FIXED_ORDERS = [
      {"id":1, "customer":"Paul Hartmann", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-01", "invoiceNumber":"RE-2026-0001", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":2, "customer":"Gabi Thomas", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-02", "invoiceNumber":"RE-2026-0002", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":3, "customer":"Antje", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-03", "invoiceNumber":"RE-2026-0003", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":4, "customer":"Tobias", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-04", "invoiceNumber":"RE-2026-0004", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":5, "customer":"Dunja", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-05", "invoiceNumber":"RE-2026-0005", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":6, "customer":"Sabine Beeween", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-06", "invoiceNumber":"RE-2026-0006", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":7, "customer":"Ralf Hartmann", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-07", "invoiceNumber":"RE-2026-0007", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":8, "customer":"Renate", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-08", "invoiceNumber":"RE-2026-0008", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":9, "customer":"Tchoffo", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-09", "invoiceNumber":"RE-2026-0009", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":10,"customer":"Silke Schwarzer", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-10", "invoiceNumber":"RE-2026-0010", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":11,"customer":"Iris", "address":"Rahden", "printer":"Ender 3 V3", "status":"Fertig", "price":10, "shippingCost":7, "tracking":"-", "orderDate":"2026-02-11", "invoiceNumber":"RE-2026-0011", "archived":true, "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]}
    ];

    let orders = [];
    let spools = [{"id":1,"name":"PLA Schwarz","remainingGrams":4160}];
    let printers = [
      { name: "CR-10 Smart Pro #1", desc: "Großraum", status: "Frei" },
      { name: "Ender 3 V3", desc: "Klipper", status: "Frei" },
      { name: "Anycubic Kobra", desc: "Direct Drive", status: "Frei" },
      { name: "CR-10 Smart Pro #2", desc: "Großraum", status: "Frei" }
    ];
    let expenses = [];
    let showingArchive = false;

    function init() {
      try {
        let saved = JSON.parse(localStorage.getItem('sefas_final_v3'));
        if (saved && Array.isArray(saved.orders) && saved.orders.length > 0) {
          orders = saved.orders;
          spools = saved.spools || spools;
          expenses = saved.expenses || expenses;
          printers = saved.printers || printers;
        } else {
          orders = FIXED_ORDERS;
        }
        // Garantiere, dass die 11 festen Kunden immer vorhanden sind
        FIXED_ORDERS.forEach(f => {
          if (!orders.some(o => o.invoiceNumber === f.invoiceNumber)) {
            orders.push(f);
          }
        });
      } catch(e) {
        orders = FIXED_ORDERS;
      }
      orders.sort((a, b) => (a.invoiceNumber || "").localeCompare(b.invoiceNumber || ""));
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('orderDate').value = new Date().toISOString().slice(0, 10);
      init();
      renderAll();
    });

    function save() {
      localStorage.setItem('sefas_final_v3', JSON.stringify({ orders, spools, expenses, printers }));
      renderAll();
    }

    async function loadCloudData() {
      try {
        const res = await fetch(NPOINT_URL, { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.orders)) {
            orders = json.orders;
            if (Array.isArray(json.spools)) spools = json.spools;
            if (Array.isArray(json.expenses)) expenses = json.expenses;
            if (Array.isArray(json.printers)) printers = json.printers;
            FIXED_ORDERS.forEach(f => {
              if (!orders.some(o => o.invoiceNumber === f.invoiceNumber)) orders.push(f);
            });
            save();
            alert("✅ Cloud-Daten erfolgreich geladen!");
          }
        }
      } catch(e) {
        alert("❌ Fehler beim Laden aus der Cloud.");
      }
    }

    async function pushToCloudManual() {
      save();
      try {
        const res = await fetch(NPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orders, spools, expenses, printers })
        });
        if (res.ok) alert("✅ Erfolgreich in der Cloud gespeichert!");
        else alert("⚠️ Cloud hat das Speichern abgelehnt.");
      } catch(e) {
        alert("❌ Netzwerkfehler beim Speichern.");
      }
    }

    function generateInvoiceNumber(dateStr) {
      const year = dateStr ? dateStr.slice(0, 4) : new Date().getFullYear().toString();
      let max = 11;
      orders.forEach(o => {
        if (o.invoiceNumber && o.invoiceNumber.startsWith(`RE-${year}-`)) {
          let n = parseInt(o.invoiceNumber.split('-')[2]) || 0;
          if (n > max) max = n;
        }
      });
      return `RE-${year}-${(max + 1).toString().padStart(4, '0')}`;
    }

    function addOrder(e) {
      e.preventDefault();
      const customer = document.getElementById('customer').value;
      const price = parseFloat(document.getElementById('price').value) || 0;
      const shippingCost = parseFloat(document.getElementById('shipping').value) || 0;
      const orderDate = document.getElementById('orderDate').value;
      const address = document.getElementById('address').value;
      const tracking = document.getElementById('tracking').value || '-';
      const printer = document.getElementById('printer').value;
      const artName = document.getElementById('artName').value;
      const invoiceNumber = generateInvoiceNumber(orderDate);

      orders.unshift({
        id: Date.now(), customer, price, shippingCost, orderDate, address, tracking, printer, invoiceNumber,
        status: "Offen", archived: false, items: [{ name: artName, color: 'Standard', weight: 50 }]
      });

      save();
      document.getElementById('orderForm').reset();
      document.getElementById('orderDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('artName').value = "3D-Druck Artikel";
    }

    function deleteOrder(id) {
      if (confirm("Auftrag löschen?")) {
        orders = orders.filter(o => o.id !== id);
        save();
      }
    }

    function toggleArchiveOrder(id) {
      const o = orders.find(x => x.id === id);
      if (o) {
        o.archived = !o.archived;
        save();
      }
    }

    function toggleArchiveView() {
      showingArchive = !showingArchive;
      document.getElementById('headerArchiveBtn').innerText = showingArchive ? "📋 Aktive Aufträge" : "📂 Archiv anzeigen";
      document.getElementById('tableTitle').innerText = showingArchive ? "Bestellungen (Archiv)" : "Bestellungen (Aktiv)";
      renderOrders();
    }

    function addSpoolPrompt() {
      const name = prompt("Spulen-Name (z.B. PLA Rot):");
      if (!name) return;
      const grams = parseInt(prompt("Gramm:", "1000")) || 1000;
      spools.push({ id: Date.now(), name, remainingGrams: grams });
      save();
    }

    function deleteSpool(idx) {
      spools.splice(idx, 1);
      save();
    }

    function renderAll() {
      renderOrders();
      renderSpools();
      renderPrinters();
      updateStats();
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      orders.forEach(o => {
        if (Boolean(o.archived) !== showingArchive) return;
        const archiveBtn = o.archived ? `<button onclick="toggleArchiveOrder(${o.id})" class="text-emerald-300">Aktivieren</button>` : `<button onclick="toggleArchiveOrder(${o.id})" class="text-purple-300">Archiv</button>`;

        tbody.innerHTML += `
          <tr class="border-b border-slate-800 hover:bg-slate-800/40 text-xs">
            <td class="p-3 text-white font-medium">${o.customer}</td>
            <td class="p-3 font-mono text-cyan-300 font-bold">${o.invoiceNumber || '-'}</td>
            <td class="p-3 text-white">${o.items?.[0]?.name || '-'}</td>
            <td class="p-3">${o.printer || '-'}</td>
            <td class="p-3">${o.orderDate || '-'}</td>
            <td class="p-3 text-yellow-300">${o.status}</td>
            <td class="p-3 text-emerald-400 font-bold">${((o.price || 0) + (o.shippingCost || 0)).toFixed(2).replace('.', ',')} €</td>
            <td class="p-3 text-right space-x-2">
              ${archiveBtn}
              <button onclick="deleteOrder(${o.id})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
      });
    }

    function renderSpools() {
      const list = document.getElementById('spoolsList');
      if (!list) return;
      list.innerHTML = '';
      spools.forEach((s, idx) => {
        list.innerHTML += `<div class="p-2 rounded bg-slate-900 border border-slate-700 text-xs flex justify-between items-center"><span class="text-white">${s.name}</span><span class="text-slate-300">${s.remainingGrams}g</span><button onclick="deleteSpool(${idx})" class="text-red-400">❌</button></div>`;
      });
    }

    function renderPrinters() {
      const grid = document.getElementById('printersGrid');
      if (!grid) return;
      grid.innerHTML = '';
      printers.forEach(p => {
        grid.innerHTML += `<div class="card p-4 rounded-2xl space-y-1"><h3 class="font-bold text-white text-sm">${p.name}</h3><p class="text-xs text-slate-400">${p.desc} (${p.status})</p></div>`;
      });
    }

    function updateStats() {
      let rev = 0, openC = 0, totalW = 0;
      orders.forEach(o => {
        if (!o.archived) {
          rev += ((o.price || 0) + (o.shippingCost || 0));
          if (o.status !== 'Fertig') openC++;
        }
        o.items?.forEach(i => totalW += (i.weight || 0));
      });
      document.getElementById('statRevenue').innerText = rev.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('statProfit').innerText = rev.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('statOpenOrders').innerText = openC;
      document.getElementById('statFilament').innerText = totalW + 'g';
    }

    function exportAccountingCSV() {
      let csv = "data:text/csv;charset=utf-8,\uFEFFRechnung;Kunde;Datum;Betrag\n";
      orders.forEach(o => { csv += `${o.invoiceNumber};${o.customer};${o.orderDate};${((o.price||0)+(o.shippingCost||0)).toFixed(2)}\n`; });
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csv));
      link.setAttribute("download", "Buchhaltung.csv");
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
  </script>
</body>
</html>
