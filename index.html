<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefas3DShop - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    @media print {
      body * { visibility: hidden !important; }
      #printSection, #printSection *, #invoiceSection, #invoiceSection * { visibility: visible !important; }
      #printSection { position: fixed !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; background: #fff !important; color: #000 !important; display: flex !important; justify-content: center !important; align-items: center !important; }
      #invoiceSection { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: #fff !important; color: #000 !important; padding: 10px !important; display: block !important; }
      .page-break-container { page-break-after: always; break-after: page; }
      @page { size: auto; margin: 5mm; }
    }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

  <div id="printSection" class="hidden"></div>
  <div id="invoiceSection" class="hidden"></div>

  <div class="max-w-[1700px] mx-auto space-y-6">
    
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 gap-4">
      <div>
        <h1 class="text-xl font-bold text-white">Sefas<span class="text-cyan-400">3d</span>shop</h1>
        <p class="text-slate-400 text-xs">Dashboard aktiv</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="loadCloudData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">🔄 Cloud abrufen</button>
        <button onclick="pushToCloudManual()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">📤 In Cloud speichern</button>
      </div>
    </header>

    <section class="card p-5 rounded-2xl space-y-4">
      <h2 class="text-md font-semibold text-slate-300">Neuen Auftrag anlegen</h2>
      <form id="orderForm" onsubmit="addOrder(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <input type="text" id="customer" placeholder="Kundenname" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="number" step="0.01" id="price" placeholder="Artikelpreis (€)" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="date" id="orderDate" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="text" id="artNameInput" placeholder="Artikelbezeichnung" value="3D-Druck Artikel" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl py-2.5 text-sm transition cursor-pointer">Auftrag Speichern</button>
      </form>
    </section>

    <section class="card p-5 rounded-2xl space-y-4">
      <h2 class="text-md font-semibold text-slate-300">Bestellungen</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">Kunde</th>
              <th class="p-3">Rechnung-Nr.</th>
              <th class="p-3">Artikel</th>
              <th class="p-3">Datum</th>
              <th class="p-3">Preis</th>
              <th class="p-3 text-right">Aktion</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const NPOINT_URL = 'https://api.npoint.io/6c03644a2096b02db81f';

    const BASE_ORDERS = [
      {"id":1, "customer":"Paul Hartmann", "price":10, "shippingCost":7, "orderDate":"2026-02-01", "invoiceNumber":"RE-2026-0001", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":2, "customer":"Gabi Thomas", "price":10, "shippingCost":7, "orderDate":"2026-02-02", "invoiceNumber":"RE-2026-0002", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":3, "customer":"Antje", "price":10, "shippingCost":7, "orderDate":"2026-02-03", "invoiceNumber":"RE-2026-0003", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":4, "customer":"Tobias", "price":10, "shippingCost":7, "orderDate":"2026-02-04", "invoiceNumber":"RE-2026-0004", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":5, "customer":"Dunja", "price":10, "shippingCost":7, "orderDate":"2026-02-05", "invoiceNumber":"RE-2026-0005", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":6, "customer":"Sabine Beeween", "price":10, "shippingCost":7, "orderDate":"2026-02-06", "invoiceNumber":"RE-2026-0006", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":7, "customer":"Ralf Hartmann", "price":10, "shippingCost":7, "orderDate":"2026-02-07", "invoiceNumber":"RE-2026-0007", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":8, "customer":"Renate", "price":10, "shippingCost":7, "orderDate":"2026-02-08", "invoiceNumber":"RE-2026-0008", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":9, "customer":"Tchoffo", "price":10, "shippingCost":7, "orderDate":"2026-02-09", "invoiceNumber":"RE-2026-0009", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":10,"customer":"Silke Schwarzer", "price":10, "shippingCost":7, "orderDate":"2026-02-10", "invoiceNumber":"RE-2026-0010", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]},
      {"id":11,"customer":"Iris", "price":10, "shippingCost":7, "orderDate":"2026-02-11", "invoiceNumber":"RE-2026-0011", "items":[{"name":"3D-Druck Artikel","color":"PLA Schwarz","weight":50}]}
    ];

    let orders = [];

    function initData() {
      try {
        let saved = JSON.parse(localStorage.getItem('sefas_clean_orders'));
        if (!Array.isArray(saved) || saved.length === 0) {
          orders = BASE_ORDERS;
        } else {
          orders = saved;
          BASE_ORDERS.forEach(b => {
            if (!orders.some(o => o.invoiceNumber === b.invoiceNumber)) {
              orders.push(b);
            }
          });
        }
      } catch(e) {
        orders = BASE_ORDERS;
      }
      orders.sort((a, b) => (a.invoiceNumber || "").localeCompare(b.invoiceNumber || ""));
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('orderDate').value = new Date().toISOString().slice(0, 10);
      initData();
      renderOrders();
    });

    function saveLocal() {
      localStorage.setItem('sefas_clean_orders', JSON.stringify(orders));
    }

    async function loadCloudData() {
      try {
        const res = await fetch(NPOINT_URL, { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.orders)) {
            orders = json.orders;
            BASE_ORDERS.forEach(b => {
              if (!orders.some(o => o.invoiceNumber === b.invoiceNumber)) {
                orders.push(b);
              }
            });
            saveLocal();
            renderOrders();
            alert("✅ Cloud-Daten erfolgreich geladen!");
          }
        }
      } catch(e) {
        alert("❌ Fehler beim Laden aus der Cloud.");
      }
    }

    async function pushToCloudManual() {
      saveLocal();
      try {
        const res = await fetch(NPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orders })
        });
        if (res.ok) alert("✅ Erfolgreich in der Cloud gespeichert!");
        else alert("⚠️ Cloud hat das Speichern abgelehnt.");
      } catch(e) {
        alert("❌ Netzwerkfehler beim Speichern.");
      }
    }

    function generateNewInvoiceNumber(orderDateStr) {
      const year = orderDateStr ? orderDateStr.slice(0, 4) : new Date().getFullYear().toString();
      let maxNum = 0;
      orders.forEach(o => {
        if (o.invoiceNumber && o.invoiceNumber.startsWith(`RE-${year}-`)) {
          let num = parseInt(o.invoiceNumber.split('-')[2]) || 0;
          if (num > maxNum) maxNum = num;
        }
      });
      return `RE-${year}-${(Math.max(11, maxNum) + 1).toString().padStart(4, '0')}`;
    }

    function addOrder(e) {
      e.preventDefault();
      const customer = document.getElementById('customer').value;
      const price = parseFloat(document.getElementById('price').value) || 0;
      const orderDate = document.getElementById('orderDate').value;
      const artName = document.getElementById('artNameInput').value;
      const invoiceNumber = generateNewInvoiceNumber(orderDate);

      orders.unshift({
        id: Date.now(),
        customer,
        price,
        shippingCost: 7,
        orderDate,
        invoiceNumber,
        items: [{ name: artName, color: 'Standard', weight: 50 }]
      });

      saveLocal();
      renderOrders();
      document.getElementById('orderForm').reset();
      document.getElementById('orderDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('artNameInput').value = "3D-Druck Artikel";
    }

    function deleteOrder(id) {
      if (confirm("Auftrag löschen?")) {
        orders = orders.filter(o => o.id !== id);
        saveLocal();
        renderOrders();
      }
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      orders.forEach(o => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40 border-b border-slate-800">
            <td class="p-3 font-medium text-white">${o.customer}</td>
            <td class="p-3 text-xs font-mono text-cyan-300 font-bold">${o.invoiceNumber || '-'}</td>
            <td class="p-3 text-xs text-white">${o.items?.[0]?.name || '-'}</td>
            <td class="p-3 text-xs text-slate-300">${o.orderDate || '-'}</td>
            <td class="p-3 text-xs text-emerald-400 font-bold">${(o.price + (o.shippingCost || 0)).toFixed(2).replace('.', ',')} €</td>
            <td class="p-3 text-right">
              <button onclick="deleteOrder(${o.id})" class="text-red-400 bg-red-500/10 px-2 py-1 rounded text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
      });
    }
  </script>
</body>
</html>
