<style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    @keyframes pulse-green {
      0%, 100% { background-color: rgba(34, 197, 94, 0.15); }
      50% { background-color: rgba(34, 197, 94, 0.35); }
    }
    .pulse-done { animation: pulse-green 2s infinite; }
    @keyframes pulse-red {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 0.9); }
    }
    .pulse-low-spool { animation: pulse-red 2s infinite; }
    
    /* DRUCK-EINSTELLUNGEN: Zwingt den Drucker exakt auf 1 Seite ohne Leerseiten */
    @media print {
      body * { visibility: hidden !important; }
      #printSection, #printSection * { visibility: visible !important; }
      #printSection { 
        position: fixed !important; 
        left: 0 !important; 
        top: 0 !important; 
        width: 100vw !important; 
        height: 100vh !important; 
        color: #000 !important; 
        background: #fff !important; 
        padding: 10px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }
      @page { size: auto; margin: 0mm; }
    }
  </style>
