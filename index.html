<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefas3DShop - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
  </style>
</head>
<body class="p-4 min-h-screen text-xs">

  <div class="max-w-[1400px] mx-auto space-y-4">
    <!-- HEADER -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
      <h1 class="text-lg font-bold text-white">Sefas<span class="text-cyan-400">3D</span>Shop Dashboard</h1>
      <div class="flex gap-2">
        <button onclick="autoAdjustProfit()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-bold cursor-pointer">🎯 117 € Reingewinn Wiederherstellen</button>
        <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold cursor-pointer">🔄 Laden</button>
        <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold cursor-pointer">📤 Speichern</button>
      </div>
    </header>

    <!-- STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="card p-4 rounded-xl"><p class="text-slate-400">Umsatz</p><h2 id="statRev" class="text-xl font-bold text-blue-400">0,00 €</h2></div>
      <div class="card p-4 rounded-xl"><p class="text-slate-400">Ausgaben</p><h2 id="statExp" class="text-xl font-bold text-red-400">0,00 €</h2></div>
      <div class="card p-4 rounded-xl"><p class="text-slate-400">Reingewinn</p><h2 id="statProfit" class="text-xl font-bold text-emerald-400">0,00 €</h2></div>
    </div>

    <!-- AUFTRAG ANLEGEN -->
    <section class="card p-4 rounded-xl space-y-3">
      <h3 class="font-bold text-white text-sm">Neuen Auftrag anlegen</h3>
      <form onsubmit="addOrder(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-2">
        <input type="text" id="cust" placeholder="Kunde" required class="bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <input type="text" id="art" placeholder="Artikel" required class="bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <input type="number" step="0.01" id="price" placeholder="Preis (€)" required class="bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold p-2 rounded cursor-pointer">+ Hinzufügen</button>
      </form>
    </section>

    <!-- TABELLE -->
    <section class="card p-4 rounded-xl">
      <h3 class="font-bold text-white text-sm mb-3">Bestellungen</h3>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-700 text-slate-400">
            <th class="p-2">Kunde</th>
            <th class="p-2">Artikel</th>
            <th class="p-2">Preis</th>
            <th class="p-2 text-right">Aktion</th>
          </tr>
        </thead>
        <tbody id="orderList" class="divide-y divide-slate-800"></tbody>
      </table>
    </section>
  </div>

  <script>
    const NPOINT_URL = 'https://api.npoint.io/6c03644a2096b02db81f';
    let orders = [];

    async function loadData() {
      try {
        const res = await fetch(NPOINT_URL);
        if (res.ok) {
          const data = await res.json();
          orders = data.orders || [];
          render();
        }
      } catch(e) { console.error(e); }
    }

    async function saveData() {
      try {
        await fetch(NPOINT_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ orders })
        });
        alert('✅ In Cloud gespeichert!');
      } catch(e) { alert('❌ Fehler beim Speichern'); }
    }

    function render() {
      const list = document.getElementById('orderList');
      list.innerHTML = '';
      let total = 0;

      orders.forEach((o, i) => {
        total += parseFloat(o.price) || 0;
        list.innerHTML += `
          <tr>
            <td class="p-2 text-white">${o.customer}</td>
            <td class="p-2 text-slate-300">${o.item}</td>
            <td class="p-2 text-emerald-400 font-bold">${parseFloat(o.price).toFixed(2).replace('.', ',')} €</td>
            <td class="p-2 text-right"><button onclick="deleteOrder(${i})" class="text-red-400">❌ Löschen</button></td>
          </tr>`;
      });

      document.getElementById('statRev').innerText = total.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('statProfit').innerText = total.toFixed(2).replace('.', ',') + ' €';
    }

    function addOrder(e) {
      e.preventDefault();
      orders.unshift({
        customer: document.getElementById('cust').value,
        item: document.getElementById('art').value,
        price: parseFloat(document.getElementById('price').value) || 0
      });
      document.getElementById('cust').value = '';
      document.getElementById('art').value = '';
      document.getElementById('price').value = '';
      render();
      saveData();
    }

    function deleteOrder(i) {
      orders.splice(i, 1);
      render();
      saveData();
    }

    function autoAdjustProfit() {
      let current = orders.reduce((sum, o) => sum + (parseFloat(o.price) || 0), 0);
      let diff = 117.00 - current;
      if (Math.abs(diff) > 0.01) {
        orders.unshift({ customer: "System-Korrektur", item: "Ausgleich gelöschte Verkäufe", price: diff });
        render();
        saveData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
