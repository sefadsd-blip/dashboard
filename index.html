<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sefas3DShop - Notfall-Login</title>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background-color: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 15px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 18px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #f87171; font-size: 12px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div id="loginCard" class="card">
    <h2>Sefas3DShop</h2>
    <p style="font-size: 13px; color: #94a3b8;">Bitte PIN (1234) eingeben:</p>
    <input type="password" id="pin" placeholder="PIN">
    <button onclick="tryLogin()">Einloggen</button>
    <div id="err" class="error">Falscher PIN!</div>
  </div>

  <div id="app" style="display: none; text-align: center;">
    <h1>🎉 Du bist eingeloggt!</h1>
    <p>Das Dashboard läuft wieder.</p>
    <button onclick="location.reload()" style="width: auto; padding: 8px 16px;">Neu starten</button>
  </div>

  <script>
    function tryLogin() {
      const val = document.getElementById('pin').value;
      if (val === '1234' || val === 'sefa') {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  </script>

</body>
</html>
